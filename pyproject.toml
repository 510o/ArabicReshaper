[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arabicdisplayer"
version = "3.0.0"
description = "Reshape Arabic text for proper display"

[tool.setuptools.packages.find]
where = ["."]
include = ["arabicdisplayer*"]

[tool.setuptools.package-data]
arabicdisplayer = ["ArabicShaping.txt"]